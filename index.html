<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A Little Surprise For You 💜</title>
<meta name="description" content="A little birthday surprise, made just for you." />

<!-- Google Fonts: Parisienne (handwritten/script) + Quicksand (clean UI) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ambient floating hearts / sparkles / glow, purely decorative -->
  <div id="ambient-layer" aria-hidden="true">
    <div class="glow-orb orb-a"></div>
    <div class="glow-orb orb-b"></div>
    <div class="glow-orb orb-c"></div>
  </div>

  <!-- progress dots, only visible once envelope has been opened -->
  <nav id="progress-indicator" aria-label="Story progress" style="display:none;"></nav>

  <!-- floating music control -->
  <button id="music-toggle" type="button" aria-label="Play music" aria-pressed="false">
    <span class="note" aria-hidden="true">🎵</span>
  </button>

  <!-- ============ SCREEN 1: LANDING + ENVELOPE ============ -->
  <section id="landing-screen" class="screen is-active">
    <div class="landing-copy">
      <p class="lead">Happy Birthdayy loveyyy💜</p>
      <p class="sub" id="landing-instruction">Tap the envelope to open it</p>
    </div>

    <div class="envelope-wrap">
      <button id="envelope" class="envelope" type="button" aria-label="Opening">
        <span class="envelope-sparkle-burst" id="envelope-sparkles" aria-hidden="true"></span>
        <span class="envelope-body" aria-hidden="true">
          <span class="envelope-letter"><span class="heart-mini">♡</span></span>
          <span class="envelope-flap"></span>
          <span class="envelope-seal">♥</span>
        </span>
      </button>
    </div>

    <p class="envelope-instruction" aria-hidden="true">✨</p>
  </section>

  <!-- ============ SCREEN 2: MAIN STORY EXPERIENCE ============ -->
  <section id="experience" class="screen">
    <div id="experience-track">

      <!-- SECTION 1 — INTRO -->
      <section class="story-section" id="section-intro" data-section-index="0">
        <h1 class="intro-heading" id="intro-heading">Happy Birthday 💜</h1>
        <div class="intro-lines" id="intro-lines" aria-live="polite"></div>
        <p class="intro-cta-line" id="intro-cta-line">Let's Starttt. ✨</p>
        <button class="btn-primary" id="start-surprise-btn" type="button" disabled>CLICK ME →</button>
      </section>

      <!-- SECTION 2 — GALLERY -->
      <section class="story-section" id="section-gallery" data-section-index="1">
        <h2 class="section-title">Little Moments, Captured</h2>
        <div class="scrapbook" id="scrapbook" role="list"></div>
      </section>

      <!-- SECTION 3 — LETTER -->
      <section class="story-section" id="section-letter" data-section-index="2">
        <h2 class="section-title">A Little Letter</h2>
        <div class="letter-paper">
          <p class="letter-body" id="letter-body"></p>
          <p class="letter-sign">With lots of love and good wishes 💜</p>
        </div>
      </section>

      <!-- SECTION 4 — TIMELINE -->
      <section class="story-section" id="section-timeline" data-section-index="3">
        <h2 class="section-title">Little Moments ✨</h2>
        <div class="timeline" id="timeline" role="list"></div>
      </section>

      <!-- SECTION 5 — FINALE -->
      <section class="story-section" id="section-finale" data-section-index="4">
        <p class="finale-pre" id="finale-pre">One Last Thing... 💜</p>
        <div class="finale-card" id="finale-card">
          <h2 id="finale-heading"></h2>
          <p class="finale-message" id="finale-message"></p>
          <p class="finale-wishes-lead" id="finale-wishes-lead">May this year bring you...</p>
          <ul class="finale-wishes" id="finale-wishes"></ul>
          <p class="finale-signoff" id="finale-signoff">Happy Birthday, Babyy!!! 💜</p>
        </div>
        <button class="replay-btn" id="replay-btn" type="button" disabled>Replay Surprise ↻</button>
      </section>

    </div>
  </section>

  <!-- back / next controls, hidden on section 1 and 5 as appropriate -->
  <div class="section-nav" id="section-nav" style="display:none;">
    <button class="nav-btn" id="nav-back" type="button">← Back</button>
    <button class="nav-btn primary" id="nav-next" type="button">Next →</button>
  </div>

  <!-- lightbox for full-size photo viewing -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <figure class="lightbox-figure">
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo">×</button>
      <img id="lightbox-img" src="" alt="" />
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <!-- celebration confetti / hearts canvas, appears at the finale -->
  <canvas id="celebration-canvas" aria-hidden="true"></canvas>

  <!-- background music -->
  <audio id="bg-music" loop preload="none">
    <source src="assets/Taylor Swift - Lover.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
