<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scan Me 💜</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<!-- QRCode.js: small, dependency-free QR generator, self-hosted in
     lib/qrcode.min.js (MIT licensed, see lib/qrcode.min.js.LICENSE.txt).
     Needed because we render an actual scannable QR matrix rather than
     a static image. Self-hosted (instead of a CDN) so the page still
     works offline, behind restrictive firewalls, or if a CDN is down. -->
<script src="lib/qrcode.min.js"></script>

<style>
  :root {
    --lavender-mist: #efe9f7;
    --lavender-light: #ddd0ef;
    --orchid: #a883d6;
    --orchid-deep: #7a4fb8;
    --plum-ink: #3d2a52;
    --blush: #f4d9e6;
    --cream: #fffaf3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
  }
  body {
    font-family: "Quicksand", sans-serif;
    color: var(--plum-ink);
    background: radial-gradient(ellipse at 20% 10%, #f7effc 0%, transparent 55%),
                radial-gradient(ellipse at 85% 85%, var(--blush) 0%, transparent 50%),
                linear-gradient(160deg, var(--lavender-mist) 0%, var(--lavender-light) 55%, #cbb3e8 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.2rem;
    text-align: center;
  }

  h1 {
    font-family: "Parisienne", cursive;
    font-size: clamp(2.2rem, 6vw, 3rem);
    color: var(--orchid-deep);
    margin: 0 0 0.3rem;
  }

  .subtitle {
    margin: 0 0 2.2rem;
    font-size: 1rem;
    opacity: 0.8;
  }

  /* heart-shaped frame around a fully standard, scannable QR code.
     A literal heart-shaped QR *matrix* is unreliable for phone
     scanners, so we keep the QR square and honest, and put the
     heart in the decorative frame around it instead. */
  .heart-frame {
    position: relative;
    width: min(78vw, 320px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .heart-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, var(--cream), var(--lavender-light));
    clip-path: path("M160,300 C40,220 0,150 0,95 C0,40 45,0 95,0 C130,0 155,20 160,55 C165,20 190,0 225,0 C275,0 320,40 320,95 C320,150 280,220 160,300 Z");
    box-shadow: 0 25px 50px -18px rgba(122, 79, 184, 0.45);
  }

  .qr-inner {
    position: relative;
    z-index: 1;
    background: var(--cream);
    padding: 14px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(61, 42, 82, 0.18);
  }

  #qr-code {
    width: 168px;
    height: 168px;
    line-height: 0;
  }
  #qr-code img, #qr-code canvas {
    display: block;
    width: 168px !important;
    height: 168px !important;
    border-radius: 4px;
  }

  .heart-accent {
    position: absolute;
    top: -14px;
    right: -6px;
    font-size: 1.8rem;
    color: var(--orchid-deep);
    z-index: 2;
    filter: drop-shadow(0 3px 4px rgba(61,42,82,0.25));
  }

  .fallback-msg {
    display: none;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--orchid-deep);
    max-width: 320px;
  }

  .surprise-note {
    margin-top: 2.2rem;
    font-family: "Parisienne", cursive;
    font-size: 1.3rem;
    color: var(--orchid-deep);
  }

  .print-hint {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    opacity: 0.6;
  }

  @media print {
    body { background: white; }
    .print-hint { display: none; }
  }
</style>
</head>
<body>

  <h1>Scan Me 💜</h1>
  <p class="subtitle">There's a little surprise waiting for you hihi</p>

  <div class="heart-frame">
    <div class="qr-inner">
      <div id="qr-code" role="img" aria-label="QR code linking to a birthday surprise website"></div>
    </div>
    <span class="heart-accent" aria-hidden="true">♥</span>
  </div>

  <p class="fallback-msg" id="fallback-msg">
    The QR code couldn't be generated right now — you can still open the
    surprise directly at the link below.
  </p>

  <p class="surprise-note">A little surprise that i hope will make you happy hehe</p>
  <p class="print-hint">This page is made to be printed or shown on another phone screen.</p>

  <script>
    // ===== CHANGE YOUR WEBSITE URL HERE =====
    const WEBSITE_URL = "https://wankar-droid.github.io/happy-birthday-babyy/";

    try {
      if (typeof QRCode === "undefined") throw new Error("QRCode library failed to load");

      new QRCode(document.getElementById("qr-code"), {
        text: WEBSITE_URL,
        width: 168,
        height: 168,
        colorDark: "#7a4fb8",   // orchid-deep — keeps strong contrast for reliable scanning
        colorLight: "#fffaf3",  // cream
        correctLevel: QRCode.CorrectLevel.H // high error-correction, since a small heart sits near it
      });
    } catch (err) {
      // fallback message if the QR library fails to load (e.g. offline)
      document.querySelector(".heart-frame").style.display = "none";
      const msg = document.getElementById("fallback-msg");
      msg.style.display = "block";
      msg.innerHTML += `<br><a href="${WEBSITE_URL}" style="color:#7a4fb8;">${WEBSITE_URL}</a>`;
    }
  </script>
</body>
</html>
